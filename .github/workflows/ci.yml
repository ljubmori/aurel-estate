name: AUREL checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/supabase-single-backend]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
